version: "3.8"

services:
  web:
    container_name: tasksapp
    restart: always
    build: .
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-tasksdb}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    container_name: tasksdb
    image: mongo:6
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tasksdb}
    volumes:
      - mongo_data:/data/db
    logging:
      driver: none

volumes:
  mongo_data:
